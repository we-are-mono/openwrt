# Let a netlink listener ask for a receive buffer of up to 4 MiB. The kernel
# default caps SO_RCVBUF at 208 KiB, so a conntrack listener such as nlbwmon
# overflows during a burst of connections and drops a whole table dump
# ("Netlink receive failure: Out of memory"). A ceiling only: nothing is
# allocated until a socket fills. Named to sort early, so a later file that
# sets a higher ceiling (adguardhome: 7.5 MB) wins.
net.core.rmem_max = 4194304
